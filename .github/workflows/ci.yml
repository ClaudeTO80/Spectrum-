name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: matrix.compiler != 'clang'
        run: cmake -S . -B build -DFFT_BUILD_TESTS=ON -DFFT_BUILD_EXAMPLES=ON

      - name: Configure Clang
        if: matrix.compiler == 'clang'
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DFFT_BUILD_TESTS=ON -DFFT_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
